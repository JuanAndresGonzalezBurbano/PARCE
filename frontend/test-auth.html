<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P.A.R.C.E Auth Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-section {
            background: #2a2a2a;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background: #2563eb;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <h1>P.A.R.C.E Authentication Test</h1>
    
    <div class="test-section">
        <h2>1. Health Check</h2>
        <button onclick="testHealth()">Test Health Endpoint</button>
        <div id="health-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>2. Login Test</h2>
        <button onclick="testLogin()">Login as Customer</button>
        <div id="login-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>3. Session Test</h2>
        <button onclick="testMe()">Check Current User (/me)</button>
        <div id="me-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>4. Logout Test</h2>
        <button onclick="testLogout()">Logout</button>
        <div id="logout-result" class="result"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api';

        async function testHealth() {
            const result = document.getElementById('health-result');
            result.textContent = 'Testing...';
            
            try {
                const response = await fetch(`${API_URL}/health`, {
                    credentials: 'include'
                });
                const data = await response.json();
                result.className = 'result success';
                result.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                result.className = 'result error';
                result.textContent = `Error: ${error.message}`;
            }
        }

        async function testLogin() {
            const result = document.getElementById('login-result');
            result.textContent = 'Testing login...';
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'customer@parce.local',
                        password: 'Customer123!',
                        remember: false
                    })
                });
                const data = await response.json();
                result.className = data.success ? 'result success' : 'result error';
                result.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                result.className = 'result error';
                result.textContent = `Error: ${error.message}`;
            }
        }

        async function testMe() {
            const result = document.getElementById('me-result');
            result.textContent = 'Testing /me...';
            
            try {
                const response = await fetch(`${API_URL}/auth/me`, {
                    credentials: 'include'
                });
                const data = await response.json();
                result.className = data.success ? 'result success' : 'result error';
                result.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                result.className = 'result error';
                result.textContent = `Error: ${error.message}`;
            }
        }

        async function testLogout() {
            const result = document.getElementById('logout-result');
            result.textContent = 'Testing logout...';
            
            try {
                const response = await fetch(`${API_URL}/auth/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });
                const data = await response.json();
                result.className = data.success ? 'result success' : 'result error';
                result.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                result.className = 'result error';
                result.textContent = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
